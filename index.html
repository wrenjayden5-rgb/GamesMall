<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Science Run</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// =======================
// ASSETS
// =======================

const bg = new Image();
bg.src = "back.png";

const groundEnemyImg = new Image();
groundEnemyImg.src = "genemy.png";

const flyingEnemyImg = new Image();
flyingEnemyImg.src = "fenemy.png";

// =======================
// WORLD
// =======================

const gravity = 0.7;
let cameraX = 0;

const player = {
    x:100,
    y:300,
    width:45,
    height:60,
    vx:0,
    vy:0,
    speed:6,
    jumpPower:-15,
    grounded:false,
    jumps:0,
    maxJumps:2,
    color:"#ff4444",
    score:0,
    health:3
};

// =======================
// INPUT
// =======================

const keys = {};

addEventListener("keydown", e=>{
    keys[e.key.toLowerCase()] = true;

    if(
        (e.code === "Space" ||
         e.key === "ArrowUp" ||
         e.key.toLowerCase() === "w")
         && player.jumps < player.maxJumps
    ){
        player.vy = player.jumpPower;
        player.jumps++;
    }
});

addEventListener("keyup", e=>{
    keys[e.key.toLowerCase()] = false;
});

// =======================
// LEVEL
// =======================

const platforms = [
    {x:-500,y:650,w:4000,h:200},

    {x:350,y:520,w:200,h:25},
    {x:650,y:430,w:220,h:25},
    {x:980,y:340,w:220,h:25},
    {x:1350,y:470,w:250,h:25},
    {x:1750,y:380,w:220,h:25},
    {x:2200,y:280,w:250,h:25},
    {x:2600,y:420,w:300,h:25},
    {x:3100,y:330,w:250,h:25},
    {x:3600,y:250,w:250,h:25}
];

// =======================
// COINS
// =======================

const coins = [];

for(let i=0;i<30;i++){
    coins.push({
        x:300 + i*130,
        y:200 + Math.sin(i)*120,
        r:12,
        collected:false
    });
}

// =======================
// GROUND ENEMIES
// =======================

const groundEnemies = [
    {x:700,y:380,w:60,h:60,min:650,max:850,dir:1,speed:2},
    {x:1500,y:420,w:60,h:60,min:1350,max:1600,dir:1,speed:2.5},
    {x:2800,y:370,w:60,h:60,min:2600,max:2900,dir:1,speed:3}
];

// =======================
// FLYING ENEMIES
// =======================

const flyingEnemies = [
    {x:1000,y:180,w:70,h:55,baseY:180,t:0},
    {x:2200,y:150,w:70,h:55,baseY:150,t:2},
    {x:3400,y:120,w:70,h:55,baseY:120,t:4}
];

// =======================
// GOAL FLAG
// =======================

const goal = {
    x:3900,
    y:120,
    w:40,
    h:130
};

let win = false;

// =======================
// COLLISION
// =======================

function intersects(a,b){
    return (
        a.x < b.x + b.w &&
        a.x + a.width > b.x &&
        a.y < b.y + b.h &&
        a.y + a.height > b.y
    );
}

// =======================
// UPDATE
// =======================

function update(){

    if(win) return;

    player.vx = 0;

    if(keys["a"] || keys["arrowleft"])
        player.vx = -player.speed;

    if(keys["d"] || keys["arrowright"])
        player.vx = player.speed;

    player.x += player.vx;

    player.vy += gravity;
    player.y += player.vy;

    player.grounded = false;

    for(const p of platforms){

        if(
            player.x + player.width > p.x &&
            player.x < p.x + p.w &&
            player.y + player.height > p.y &&
            player.y + player.height - player.vy <= p.y
        ){
            player.y = p.y - player.height;
            player.vy = 0;
            player.grounded = true;
            player.jumps = 0;
        }
    }

    // Ground enemies
    for(const e of groundEnemies){

        e.x += e.speed * e.dir;

        if(e.x < e.min || e.x > e.max)
            e.dir *= -1;

        if(
            player.x < e.x + e.w &&
            player.x + player.width > e.x &&
            player.y < e.y + e.h &&
            player.y + player.height > e.y
        ){
            player.health--;

            player.x = 100;
            player.y = 300;

            if(player.health <= 0){
                alert("Game Over!");
                location.reload();
            }
        }
    }

    // Flying enemies
    for(const f of flyingEnemies){

        f.t += 0.03;
        f.y = f.baseY + Math.sin(f.t) * 50;
        f.x += Math.cos(f.t) * 1.5;

        if(
            player.x < f.x + f.w &&
            player.x + player.width > f.x &&
            player.y < f.y + f.h &&
            player.y + player.height > f.y
        ){
            player.health--;

            player.x = 100;
            player.y = 300;

            if(player.health <= 0){
                alert("Game Over!");
                location.reload();
            }
        }
    }

    // Coins
    for(const coin of coins){

        if(coin.collected) continue;

        const dx = player.x + player.width/2 - coin.x;
        const dy = player.y + player.height/2 - coin.y;

        if(Math.sqrt(dx*dx + dy*dy) < 30){
            coin.collected = true;
            player.score += 10;
        }
    }

    // Goal
    if(
        player.x < goal.x + goal.w &&
        player.x + player.width > goal.x &&
        player.y < goal.y + goal.h &&
        player.y + player.height > goal.y
    ){
        win = true;
    }

    cameraX = player.x - canvas.width/3;

    if(player.y > 1200){
        player.x = 100;
        player.y = 300;
    }
}

// =======================
// DRAW
// =======================

function draw(){

    // Background
    if(bg.complete){

        const bgWidth = 1920;

        for(let i=-2;i<20;i++){
            ctx.drawImage(
                bg,
                i*bgWidth - (cameraX*0.3)%bgWidth,
                0,
                bgWidth,
                canvas.height
            );
        }

    }else{
        ctx.fillStyle = "#6ec6ff";
        ctx.fillRect(0,0,canvas.width,canvas.height);
    }

    ctx.save();
    ctx.translate(-cameraX,0);

    // Platforms
    ctx.fillStyle = "#5c4033";

    for(const p of platforms){
        ctx.fillRect(p.x,p.y,p.w,p.h);
    }

    // Coins
    for(const coin of coins){

        if(coin.collected) continue;

        ctx.beginPath();
        ctx.fillStyle = "gold";
        ctx.arc(coin.x,coin.y,coin.r,0,Math.PI*2);
        ctx.fill();
    }

    // Goal Flag
    ctx.fillStyle = "#ddd";
    ctx.fillRect(goal.x,goal.y,10,goal.h);

    ctx.fillStyle = "#00ff00";
    ctx.fillRect(goal.x+10,goal.y,50,40);

    // Ground Enemies
    for(const e of groundEnemies){

        if(groundEnemyImg.complete){
            ctx.drawImage(
                groundEnemyImg,
                e.x,
                e.y,
                e.w,
                e.h
            );
        }else{
            ctx.fillStyle="purple";
            ctx.fillRect(e.x,e.y,e.w,e.h);
        }
    }

    // Flying Enemies
    for(const f of flyingEnemies){

        if(flyingEnemyImg.complete){
            ctx.drawImage(
                flyingEnemyImg,
                f.x,
                f.y,
                f.w,
                f.h
            );
        }else{
            ctx.fillStyle="orange";
            ctx.fillRect(f.x,f.y,f.w,f.h);
        }
    }

    // Player
    ctx.fillStyle = player.color;
    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );

    ctx.restore();

    // UI
    ctx.fillStyle = "white";
    ctx.font = "28px Arial";
    ctx.fillText("Score: " + player.score, 20, 40);
    ctx.fillText("Lives: " + player.health, 20, 80);

    if(win){

        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle = "white";
        ctx.font = "70px Arial";
        ctx.textAlign = "center";
        ctx.fillText(
            "LEVEL COMPLETE!",
            canvas.width/2,
            canvas.height/2
        );

        ctx.font = "32px Arial";
        ctx.fillText(
            "Final Score: " + player.score,
            canvas.width/2,
            canvas.height/2 + 60
        );
    }
}

// =======================
// GAME LOOP
// =======================

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>
</body>
</html>
